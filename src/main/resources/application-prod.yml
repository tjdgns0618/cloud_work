spring:
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        instance-profile: true
  config:
    import: aws-parameterstore:/cloud-work/prod/db/
  datasource:
    url: "${url}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: "${username}"
    password: "${password}"
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        show-sql: false
    hibernate:
      ddl-auto: validate

management:
  info:
    env:
      enabled: true

info:
  app:
    message: ${info}
